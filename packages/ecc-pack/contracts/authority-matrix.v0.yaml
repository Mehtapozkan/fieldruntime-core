matrix_id: ecc_authority_matrix_v0
version: 0.1.0
date: '2026-08-26'
default: deny
permission_codes:
  A: allow within role and configured business limits
  S: scoped to assigned tenant, case, project, or evidence scope
  P: propose only; cannot approve or execute
  R: receipt-bound execution of the exact approved payload
  C: co-approval or controlled break-glass required
  D: deny
