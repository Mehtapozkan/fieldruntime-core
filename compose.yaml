name: fieldruntime-core

services:
  postgres:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fieldruntime}
      POSTGRES_USER: ${POSTGRES_USER:-fieldruntime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-evaluation-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    volumes:
      - fieldruntime-postgres:/var/lib/postgresql/data

  core:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fieldruntime}:${POSTGRES_PASSWORD:-local-evaluation-only}@postgres:5432/${POSTGRES_DB:-fieldruntime}
      FIELD_RUNTIME_BIND: 0.0.0.0
      FIELD_RUNTIME_PORT: 3210
      FIELD_RUNTIME_MODE: simulation
      FIELD_RUNTIME_EXTERNAL_WRITES: "false"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3210/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:3210:3210"
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp

volumes:
  fieldruntime-postgres:
